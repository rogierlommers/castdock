openapi: 3.0.3
info:
  title: CastDock API
  version: 0.1.0
  description: |
    HTTP endpoints used by CastDock's web player and subscription tooling.
    CastDock is a single-user, self-hosted application with optional
    cookie-based authentication. Keep unauthenticated deployments on a trusted network.
servers:
  - url: /
security:
  - cookieAuth: []
tags:
  - name: System
  - name: Playback
  - name: Queue
  - name: Subscriptions
paths:
  /healthz:
    get:
      security: []
      tags: [System]
      summary: Check service and database health
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"
        "503":
          description: Database is unavailable
  /login:
    get:
      security: []
      tags: [System]
      summary: Render the login form
      operationId: getLogin
      responses:
        "200":
          description: HTML login form
        "303":
          description: Authentication is disabled or the request already has a valid session
    post:
      security: []
      tags: [System]
      summary: Authenticate and create a session
      operationId: login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                next:
                  type: string
      responses:
        "303":
          description: Login succeeded; session cookie set
        "401":
          description: Invalid credentials
  /api/session:
    post:
      security: []
      tags: [System]
      summary: Create a native-client session
      operationId: createAPISession
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "204":
          description: Session created, or authentication is disabled
        "400":
          description: Invalid request body
        "401":
          description: Invalid credentials
    delete:
      security: []
      tags: [System]
      summary: Revoke a native-client session
      operationId: deleteAPISession
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204":
          description: Session revoked
  /logout:
    post:
      tags: [System]
      summary: Revoke the current session
      operationId: logout
      responses:
        "303":
          description: Session revoked and cookie cleared
  /api/home:
    get:
      tags: [Queue]
      summary: Get Inbox and Up Next episodes
      operationId: getHome
      responses:
        "200":
          description: Canonical home state shared by native clients
          content:
            application/json:
              schema:
                type: object
                required: [inbox, upNext]
                properties:
                  inbox:
                    type: array
                    items:
                      $ref: "#/components/schemas/Episode"
                  upNext:
                    type: array
                    items:
                      $ref: "#/components/schemas/Episode"
        "401":
          description: Authentication required
  /api/episodes/{id}:
    get:
      tags: [Playback]
      summary: Get one episode
      operationId: getEpisode
      parameters:
        - $ref: "#/components/parameters/EpisodeID"
      responses:
        "200":
          description: Episode detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "404":
          description: Episode not found
  /api/episodes/{id}/queue:
    post:
      tags: [Queue]
      summary: Append an episode to Up Next
      operationId: queueEpisode
      parameters:
        - $ref: "#/components/parameters/EpisodeID"
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204":
          description: Episode queued
        "404":
          description: Episode not found
  /api/episodes/{id}/archive:
    post:
      tags: [Queue]
      summary: Archive an episode
      operationId: archiveEpisode
      parameters:
        - $ref: "#/components/parameters/EpisodeID"
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204":
          description: Episode archived
        "404":
          description: Episode not found
  /api/episodes/{id}/played:
    post:
      tags: [Playback]
      summary: Mark an episode played and archive it
      operationId: markEpisodePlayedAPI
      parameters:
        - $ref: "#/components/parameters/EpisodeID"
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204":
          description: Episode marked played
        "404":
          description: Episode not found
  /api/episodes/{id}/playback:
    post:
      tags: [Playback]
      summary: Save episode playback state
      description: Older updates are ignored using the clientUpdatedAt timestamp. Completing a queued episode archives it and may return the next queued episode.
      operationId: saveEpisodePlayback
      parameters:
        - $ref: "#/components/parameters/EpisodeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackUpdate"
      responses:
        "200":
          description: Playback state saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackUpdateResponse"
        "400":
          description: Invalid episode ID, timestamp, position, or request body
        "403":
          description: Cross-origin write rejected
        "500":
          description: Internal server error
  /api/feeds/{id}/playback-options:
    post:
      tags: [Playback]
      summary: Update subscription playback speed from a native client
      operationId: updateFeedPlaybackOptionsAPI
      parameters:
        - $ref: "#/components/parameters/FeedID"
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playbackSpeed]
              properties:
                playbackSpeed:
                  type: number
                  format: double
                  minimum: 0.5
                  maximum: 3.0
      responses:
        "204":
          description: Playback speed updated
        "400":
          description: Invalid payload or playback speed
        "401":
          description: Authentication required
        "403":
          description: Cross-origin write rejected
        "404":
          description: Feed not found
        "500":
          description: Internal server error
  /episodes/{id}/played:
    post:
      tags: [Playback]
      summary: Mark an episode as played and archive it
      description: Marks playback completed. If the episode is queued, it is removed and the remaining queue is compacted.
      operationId: markEpisodePlayed
      parameters:
        - $ref: "#/components/parameters/EpisodeID"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                return_to:
                  type: string
                  description: Local path used after the state change
      responses:
        "303":
          description: Episode marked played; redirects to the requested local page
        "403":
          description: Cross-origin write rejected
        "404":
          description: Episode not found
        "500":
          description: Internal server error
  /api/queue/reorder:
    post:
      tags: [Queue]
      summary: Move a queued episode to an absolute position
      operationId: reorderQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueReorder"
      responses:
        "204":
          description: Queue reordered
        "400":
          description: Invalid payload or target position
        "403":
          description: Cross-origin write rejected
        "404":
          description: Episode is not queued
        "500":
          description: Internal server error
  /library/import:
    post:
      tags: [Subscriptions]
      summary: Import subscriptions from OPML
      operationId: importOPML
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [opml]
              properties:
                opml:
                  type: string
                  format: binary
      responses:
        "303":
          description: Import completed or validation failed; redirects to Library with a result message
        "403":
          description: Cross-origin write rejected
  /library/export.opml:
    get:
      tags: [Subscriptions]
      summary: Export all subscriptions as OPML 2.0
      operationId: exportOPML
      responses:
        "200":
          description: OPML subscription document
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/x-opml:
              schema:
                type: string
                format: binary
        "500":
          description: Internal server error
  /feeds/{id}/playback-options:
    post:
      tags: [Playback]
      summary: Update subscription-level playback options
      description: Sets the playback speed automatically applied to every episode from this subscription.
      operationId: updateFeedPlaybackOptions
      parameters:
        - $ref: "#/components/parameters/FeedID"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [playback_speed]
              properties:
                playback_speed:
                  type: number
                  format: double
                  minimum: 0.5
                  maximum: 3.0
      responses:
        "303":
          description: Options saved; redirects to the feed page
        "400":
          description: Playback speed is invalid or outside the supported range
        "403":
          description: Cross-origin write rejected
        "404":
          description: Feed not found
        "500":
          description: Internal server error
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: castdock_session
  parameters:
    ClientHeader:
      name: X-CastDock-Client
      in: header
      required: false
      description: Native clients set this header on writes that do not carry browser Origin metadata.
      schema:
        type: string
        example: ios
    EpisodeID:
      name: id
      in: path
      required: true
      description: Numeric episode ID
      schema:
        type: integer
        format: int64
        minimum: 1
    FeedID:
      name: id
      in: path
      required: true
      description: Numeric feed ID
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    Episode:
      type: object
      required: [id, feedId, podcastTitle, title, description, durationSeconds, enclosureUrl, enclosureType, state, positionSeconds, playedDuration, completed, playbackSpeed]
      properties:
        id: {type: integer, format: int64}
        feedId: {type: integer, format: int64}
        podcastTitle: {type: string}
        title: {type: string}
        description: {type: string}
        publishedAt: {type: string, format: date-time}
        durationSeconds: {type: integer}
        enclosureUrl: {type: string, format: uri}
        enclosureType: {type: string}
        imageUrl: {type: string, format: uri}
        state: {type: string, enum: [inbox, queued, archived]}
        queuePosition: {type: integer}
        positionSeconds: {type: number, format: double}
        playedDuration: {type: number, format: double}
        completed: {type: boolean}
        playbackUpdatedAt: {type: string, format: date-time}
        playbackSpeed: {type: number, format: double, minimum: 0.5, maximum: 3.0}
    PlaybackUpdate:
      type: object
      required: [position, duration, completed, playing, clientUpdatedAt]
      additionalProperties: false
      properties:
        position:
          type: number
          format: double
          minimum: 0
        duration:
          type: number
          format: double
          minimum: 0
        completed:
          type: boolean
        playing:
          type: boolean
        clientUpdatedAt:
          type: string
          format: date-time
    PlaybackUpdateResponse:
      type: object
      properties:
        nextEpisodeUrl:
          type: string
          description: Relative URL of the next queued episode, when completion advanced the queue
          example: /episodes/42
    QueueReorder:
      type: object
      required: [episodeId, targetPosition]
      additionalProperties: false
      properties:
        episodeId:
          type: integer
          format: int64
          minimum: 1
        targetPosition:
          type: integer
          minimum: 1
