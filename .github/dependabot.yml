version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees: [rogierlommers]
    open-pull-requests-limit: 3
    labels: [dependencies, go]
    commit-message:
      prefix: deps(go)
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy/compose
    schedule:
      interval: weekly
      day: monday
    assignees: [rogierlommers]
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: deps(docker)
    groups:
      docker-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees: [rogierlommers]
    open-pull-requests-limit: 3
    labels: [dependencies, github-actions]
    commit-message:
      prefix: deps(actions)
    groups:
      github-actions:
        patterns: ["*"]
